<section class="mx-5 mb-5">
  <h1 class="text-2xl font-bold">Pipes no tan comunes</h1>
  <h3 class="text-xl font-thin">Pipes incluidos en Angular</h3>
</section>

<section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
  <card-component title="i18nSelectPipe">
    <p>Saludos {{ client().name }}, es un placer {{ client().gender | i18nSelect:invitationMap }} a nuestro evento</p>

    <button class="btn btn-primary"
            (click)="onChangeClient()">Cambiar cliente</button>
  </card-component>

  <card-component title="i18nPluralPipe">
    <p>
      Actualmente hay {{ clients().length }} personas esperando
    </p>

    <button class="btn btn-primary"
            (click)="onDeleteClient()"
            [disabled]="clients().length === 0">Quitar cliente</button>
  </card-component>
</section>
