
<div #map class="h-[60vh] sm:h-[calc(100vh-64px)]"></div>


<section class="h-[40vh] sm:fixed sm:w-[260px] bg-white sm:rounded sm:top-20 sm:left-10 p-5 overflow-y-scroll">
  <h2 class="text-xl font-bold text-black mb-2">
    Marcadores
  </h2>

  <div class="flex flex-col gap-2 w-full">
    @for (marker of markers(); track marker.id) {
      <label class="flex w-full items center justify-between cursor-pointer"
            (click)="flyToMarker(marker.mapLibeMarker.getLngLat())"
            (dblclick)="deleteMarker(marker)">
        <span class="label-text text-black text-xs">
          {{ marker.mapLibeMarker.getLngLat() | json }}
        </span>
        <input type="radio"
              name="radio-12"
              checked="checked"
              class="radio"
              [style]="{ backgroundColor: marker.mapLibeMarker._color}" />
      </label>
    }
    @empty {
      <div class="flex justify-center items-center bg-blue-100 rounded py-5">
        <p class="text-xs text-secondary">No hay marcadores</p>
      </div>
    }
  </div>
</section>
