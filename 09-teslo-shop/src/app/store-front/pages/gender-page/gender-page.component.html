<h1 class="text-3xl font-bold font-montserrat">Todos los productos
  <span class="text-accent">{{ gender() | uppercase }}</span>
</h1>
<h2 class="text-xl mb-5">Mostrando productos</h2>

<div class="grid grid-cols-1 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-3">
  <!-- product-card -->
  @for (producto of productsResource.value()?.products; track $index) {
    <product-card [product]="producto" />
  }
  <!-- empty -->
  @empty {
      <p>No hay productos</p>
    }
</div>

<app-pagination [pages]="productsResource.value()?.pages ?? 0"
                [count]="productsResource.value()?.count"
                [currentPage]="paginationService.currentPage()"/>
