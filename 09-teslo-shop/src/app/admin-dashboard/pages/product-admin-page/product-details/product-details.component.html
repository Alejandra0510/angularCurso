<h1 class="text-2xl font-bold">{{ product().title }}</h1>
<div class="divider"></div>

<form class="grid grid-cols-1 sm:grid-cols-2 gap-4" [formGroup]="formProduct" (ngSubmit)="onSubmit()">
  <!-- Datos generales -->
  <div class="flex flex-col gap-2">
    <h2 class="text-2xl font-bold h-12">Datos generales</h2>
    <input
      type="text"
      placeholder="title"
      class="input input-bordered w-full"
      formControlName="title"
      [class.border-red-500]="formProduct.get('title')?.errors ?? false"
    />
    <form-error-label [control]="formProduct.get('title')!"/>

    <input
      type="text"
      placeholder="Slug"
      class="input input-bordered w-full"
      formControlName="slug"
      [class.border-red-500]="formProduct.get('slug')?.errors ?? false"
    />
    <form-error-label [control]="formProduct.get('slug')!"/>

    <textarea
      class="textarea textarea-bordered"
      placeholder="Descripción"
      rows="6"
      formControlName="description"
      [class.border-red-500]="formProduct.get('description')?.errors ?? false"
    ></textarea>
    <form-error-label [control]="formProduct.get('description')!"/>

    <h2 class="text-lg font-bold">Datos de venta</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
      <div>
        <input
          type="number"
          placeholder="Precio"
          class="input input-bordered w-full"
          formControlName="price"
          [class.border-red-500]="formProduct.get('price')?.errors ?? false"
        />
        <form-error-label [control]="formProduct.get('price')!"/>
      </div>

      <div>
        <input
          type="number"
          placeholder="Inventario"
          class="input input-bordered w-full"
          formControlName="stock"
          [class.border-red-500]="formProduct.get('stock')?.errors ?? false"
        />
        <form-error-label [control]="formProduct.get('stock')!"/>
      </div>

    </div>

    <!-- tags -->
    <input
      type="text"
      placeholder="Tags"
      class="input input-bordered w-full"
      formControlName="tags"
      [class.border-red-500]="formProduct.get('tags')?.errors ?? false"
    />
    <form-error-label [control]="formProduct.get('tags')!"/>

    <!-- Botones para el género -->
    <div class="grid grid-cols-4 gap-2">
      <!-- <button class="btn btn-sm btn-outline">Masculino</button> -->
      <button
        class="btn btn-sm"
        type="button"
        [class.btn-primary]="formProduct.value.gender ==='men'"
        (click)="formProduct.patchValue({ gender: 'men'})">
        Masculino
      </button>
      <button
        class="btn btn-sm"
        type="button"
        [class.btn-accent]="formProduct.value.gender ==='women'"
        (click)="formProduct.patchValue({ gender: 'women'})">
        Femenino
      </button>
      <button
        class="btn btn-sm"
        type="button"
        [class.btn-warning]="formProduct.value.gender ==='kid'"
        (click)="formProduct.patchValue({ gender: 'kid'})">
        <!-- cambiar el valor del formulario -->
        Kid
      </button>
      <button
        class="btn btn-sm"
        type="button"
        [class.btn-secondary]="formProduct.value.gender ==='unisex'"
        (click)="formProduct.patchValue({ gender: 'unisex'})">
        Unisex
      </button>
    </div>

    <!-- <select class="select select-bordered w-full">
      <option value="male">Masculino</option>
      <option value="female">Femenino</option>
      <option value="unisex">Unisex</option>
    </select> -->

    <!-- Sizes -->
    <div class="grid grid-cols-6 gap-2">
      @for (size of sizes; track size) {
      <button class="btn btn-sm"
        (click)="onSizeClicked(size)"
        [class.btn-accent]="formProduct.value.sizes?.includes(size)"
        type="button">
        {{ size }}
      </button>
      }
    </div>
  </div>

  <!-- Imágenes -->
  <div class="flex flex-col gap-2">
    <div class="flex justify-end h-12">
      <button class="btn btn-secondary" type="submit">
        <!-- <span class="loading loading-spinner loading-sm"></span> -->

        Guardar
      </button>
    </div>

    <!-- <product-carousel [images]="product().images" /> -->
    <product-carousel [images]="updateFilesTemp() " />

    <input type="file"
           class="file-input file-input-bordered w-full mt-4"
           accept="image/*"
           multiple
           (change)="onFilesChanged($event)"/>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2">
      @for (image of imagesTemp(); track image) {
        <img [src]="image"
             alt="Temporal image"
             class="w-full object-cover rounded-xl">
      }
    </div>
  </div>
</form>

@if (wasSave()) {
  <div class="alert alert-success fixed bottom-4 right-4 w-80 animated-fadeIn">
    <span>Datos actualizados correctamente</span>
  </div>
}
