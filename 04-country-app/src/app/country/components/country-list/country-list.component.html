<!-- componente de la tabla country-list -->
<section class="mt-5">
  <table class="table table-md mt-2 w-full">
    <thead>
      <tr>
        <th>#</th>
        <th>Ícono</th>
        <th>Bandera</th>
        <th>Nombre</th>
        <th>Capital</th>
        <th>Población</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (country of countries(); track country.cioc; let index = $index) {
        <tr>
          <td>{{ index + 1}}</td>
          <td>{{ country.emoji }}</td>
          <td>
            <img [src]="country.urlSvg" [alt]="country.names"
              class="w-10">
          </td>
          <td>{{ country.names }}</td>
          <td>{{ country.capitals }}</td>
          <td>
            <span class="badge badge-secondary">
              {{ country.population | number }}
            </span>
          </td>
          <td>
            <a [routerLink]="['/country/by', country.cioc]"
              class="link-primary cursor-pointer">Más información</a>
          </td>
        </tr>
      }
    </tbody>
  </table>
</section>
