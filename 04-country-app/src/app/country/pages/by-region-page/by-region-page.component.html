<section>
  <h1 class="text-2xl">Por Región</h1>
  <h3 class="text-lg">Seleccione una región</h3>
</section>
<section class="row mt-2">
  <div class="flex-col">
    @for (region of regions; track region) {
      <button class="btn btn-outline btn-secondary mr-2 w-100px"
              (click)="getInfoByRegion(region)"
              [class.btn-active]="region_val() === region">
        {{ region }}
      </button>
    }
  </div>
<section>
  <country-list [countries] = "regionResource.value() ?? []"
                [errorMessage]="regionResource.error()"
                [isEmpty]="regionResource.value()?.length == 0"
                [isLoading]="regionResource.isLoading()"  />
</section>
